name: Python API validation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install exact development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Validate lint tests and dependencies
        run: python scripts/verify.py
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: partner-catalog-api-evidence
          path: evidence/
          retention-days: 14
