[project]
name = "partner-catalog-api"
version = "1.0.0"
description = "Small, persistent B2B partner catalog built for Python backend practice"
requires-python = ">=3.12,<3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.coverage.run]
source = ["partner_catalog"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
